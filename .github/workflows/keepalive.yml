name: keepalive
# Despierta el servidor de Render cada ~10 min. Es un respaldo: el propio servidor tambien se hace ping a si mismo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 https://duelo-reflejos.onrender.com/healthz
